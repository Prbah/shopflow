name: shopflow_CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v5

      - name: scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install dependencies 
        run: pip install -r requirements.txt
     
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::390663897243:role/Github-OIDC
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ShopFlowGitHubActions

      - name: Run tests
        run: python -m pytest -v 

      - name: build image
        run: docker build -t shopflow-product:ci .

      - name: Inspect Python packages in CI image
        run: |
          docker run --rm shopflow-product:ci python -m pip list
          docker run --rm shopflow-product:ci python -m pip freeze

      - name: Trivy scan for image vulnerability 
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: shopflow-product:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: shopflow-product
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag shopflow-product:ci "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

