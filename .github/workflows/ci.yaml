name: ShopFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

#permission provided for githubaction

permissions:
  contents: read
  id-token: write #allows github to request an OIDC token for aws authentication


jobs:

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2


  test:
    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shopflow_products
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopflow -d shopflow_products"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://shopflow:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/shopflow_products



    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r ../../requirements.txt
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -v tests/



  build:
    needs: [test, secret-scan]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build --pull \
            -f services/${{ matrix.service }}/Dockerfile \
            -t shopflow-${{ matrix.service }}:${{ github.sha }} \
            services/${{ matrix.service }}
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: 'v0.76.1'
          image-ref: shopflow-${{ matrix.service }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '0'
          scanners: vuln


      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::390663897243:role/Github-OIDC
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ShopFlowGitHubActions


      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2



      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: shopflow-product
          IMAGE_TAG: ${{ matrix.service }}-${{ github.sha }}
        run: |
          docker tag shopflow-${{ matrix.service }}:${{ github.sha }} "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"



