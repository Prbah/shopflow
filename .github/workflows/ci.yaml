name: shopflow_CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v5

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install dependencies 
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v 

      - name: build image
        run: docker build -t shopflow-product:ci .

