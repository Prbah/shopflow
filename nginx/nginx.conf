events {}

http {
    server {
        listen 8080;

        # Product Service
        location = /api/products {
            proxy_pass http://product-service:8000/products;
        }

        location /api/products/ {
            proxy_pass http://product-service:8000/products/;
        }

        # Order Service
        location = /api/orders {
            proxy_pass http://order-service:8001/orders;
        }

        location /api/orders/ {
            proxy_pass http://order-service:8001/orders/;
        }

        # Payment Service
        location = /api/payments {
            proxy_pass http://payment-service:8002/payments;
        }

        location /api/payments/ {
            proxy_pass http://payment-service:8002/payments/;
        }

        # Notification Service
        location = /api/notifications {
            proxy_pass http://notification-service:8003/notifications;
        }

        location /api/notifications/ {
            proxy_pass http://notification-service:8003/notifications/;
        }
    }
}
